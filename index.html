<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exceed Automa: M. Bison Master Final v9</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { --sf-yellow: #fdd835; --sf-red: #d32f2f; --sf-blue: #1565c0; --bg-dark: #0a0a0a; --panel-bg: #1a1a24; --text-light: #f5f5f5; --exceed-purple: #9c27b0; }
        body { font-family: 'Bebas Neue', sans-serif; background: radial-gradient(circle at center, #2b2b3c 0%, var(--bg-dark) 100%); color: var(--text-light); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        h1 { font-family: 'Press Start 2P', cursive; color: var(--sf-yellow); text-shadow: 3px 3px 0px var(--sf-red); text-align: center; font-size: 1rem; margin-bottom: 20px; }
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 900px; }
        @media (max-width: 768px) { .grid-container { grid-template-columns: 1fr; } }
        .panel { background-color: var(--panel-bg); padding: 15px; border: 2px solid #444; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .hp-bar-bg { width: 100%; height: 25px; background: #333; border: 2px solid #fff; position: relative; margin-top: 5px; }
        .hp-bar-fill { height: 100%; background: #64dd17; transition: width 0.3s; }
        .btn { background: linear-gradient(to bottom, #e53935, #b71c1c); color: white; border: 2px solid #fff; padding: 10px; cursor: pointer; width: 100%; margin-top: 5px; font-family: 'Bebas Neue'; font-size: 1.2rem; text-transform: uppercase; box-shadow: 2px 2px 0 #000; }
        .log-box { background: #000; color: #76ff03; padding: 10px; height: 200px; overflow-y: auto; font-family: monospace; font-size: 0.85rem; border: 1px solid #555; border-radius: 4px; line-height: 1.4; }
        .strike-ui { display: none; background: #222; padding: 15px; border: 2px solid var(--sf-yellow); margin-top: 10px; border-radius: 4px; }
        #gameOver { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        input[type=number] { background: #333; color: white; border: 1px solid var(--sf-yellow); font-family: 'Press Start 2P', cursive; padding: 5px; width: 60px; text-align: center; }
    </style>
</head>
<body>

    <div id="gameOver">
        <h2 id="winText" style="font-family:'Press Start 2P'; color: var(--sf-yellow); text-align: center;"></h2>
        <button class="btn" style="width:250px; margin-top:30px;" onclick="location.reload()">REINTENTAR</button>
    </div>

    <h1>EXCEED S3: M. BISON MASTER (V9)</h1>

    <div class="grid-container">
        <div class="panel">
            <div style="display:flex; justify-content: space-between; margin-bottom: 10px; color: #aaa;">
                <span>MAZO: <b id="deckCount">30</b></span>
                <span style="color:var(--sf-yellow)">GAUGE: <b id="gaugeCount">0</b></span>
                <span>MANO: <b id="handCount">0</b></span>
            </div>
            
            <div class="hp-bar-bg"><div id="pHPFill" class="hp-bar-fill"></div><div style="position:absolute; width:100%; text-align:center; top:0; color:white; font-size:0.8rem; line-height:25px;">JUGADOR: <span id="pHPText">30</span> PV</div></div>
            <div class="hp-bar-bg"><div id="bHPFill" class="hp-bar-fill" style="background:var(--sf-red)"></div><div style="position:absolute; width:100%; text-align:center; top:0; color:white; font-size:0.8rem; line-height:25px;">M. BISON: <span id="bHPText">30</span> PV</div></div>
            
            <div style="text-align:center; margin:15px 0; background:#000; padding:15px; border-radius: 4px; border: 1px solid var(--sf-blue);">
                <button class="btn" style="width:45px; display:inline; margin:0;" onclick="modDist(-1)">-</button>
                <span style="font-size: 1.8rem; margin: 0 20px; font-family:'Press Start 2P';">R:<span id="rangeText">4</span></span>
                <button class="btn" style="width:45px; display:inline; margin:0;" onclick="modDist(1)">+</button>
            </div>

            <button class="btn" onclick="turnoBison()" id="cpuBtn">TURNO BISON (CPU)</button>
            <button class="btn" style="background:var(--sf-blue)" onclick="strikeManual()" id="playerBtn">JUGADOR ASALTO</button>
            <button class="btn" id="btnAdv" style="background:#444;" onclick="toggleAdv()">VENTAJA: NINGUNA</button>
        </div>

        <div class="panel">
            <div class="log-box" id="log"></div>
            
            <div id="strikeUI" class="strike-ui">
                <div id="bisonCard" style="background:#111; padding:12px; border-left:4px solid var(--sf-red); margin-bottom:15px; display:none; font-family: sans-serif;"></div>
                
                <div id="inputs">
                    <div style="display:flex; justify-content: space-around; margin-bottom:15px; text-align: center;">
                        <div>SPD Jugador:<br><input type="number" id="pSpeed" value="5"></div>
                        <div>POW Jugador:<br><input type="number" id="pDmg" value="4"></div>
                    </div>
                    <button class="btn" id="btnRevelar" style="background:var(--sf-yellow); color:#000; border-color:#000;" onclick="revelar()">REVELAR CARTA BISON</button>
                </div>

                <div id="resolveStep" style="display:none;">
                    <p style="text-align:center; color:#aaa; font-size: 0.85rem;">FASE BEFORE: Aplica movimientos. Ajusta tus stats arriba si el rango cambia.</p>
                    <button class="btn" style="background:var(--sf-blue)" onclick="compararVelocidad()">RESOLVER IMPACTO</button>
                </div>

                <div id="afterPhase" style="display:none; text-align:center; border: 2px solid var(--sf-blue); padding: 10px; background:#1a1a24; margin-top: 10px;">
                    <p id="afterText" style="font-size: 0.9rem; margin-bottom:10px;"></p>
                    <button class="btn" style="background:#000;" onclick="limpiar()">OK: IR A LIMPIEZA</button>
                </div>

                <div id="stunCheck" style="display:none; text-align:center; border: 2px solid var(--sf-red); padding: 10px; background:#300;">
                    <p id="msgBisonHit" style="font-size:1.1rem; margin-bottom:10px; font-weight: bold;"></p>
                    <button class="btn" style="background:var(--sf-red)" onclick="finalizarAsalto(true)">ESTOY ATURDIDO (STUN)</button>
                    <button class="btn" style="background:#2e7d32" onclick="finalizarAsalto(false)">SOBREVIVO (CONTRAATAQUE)</button>
                </div>
            </div>
        </div>
    </div>

<script>
    const db = [
        { n: "Grasp", s: 7, p: 3, r: [1,1], g: 0, a: 0, e: "Hit: Push 1" }, { n: "Grasp", s: 7, p: 3, r: [1,1], g: 0, a: 0, e: "Hit: Push 1" },
        { n: "Cross", s: 6, p: 3, r: [1,2], g: 0, a: 0, e: "After: Move up to 2" }, { n: "Cross", s: 6, p: 3, r: [1,2], g: 0, a: 0, e: "After: Move up to 2" },
        { n: "Assault", s: 4, p: 4, r: [2,3], g: 0, a: 0, e: "Before: Close 1 or 2" }, { n: "Assault", s: 4, p: 4, r: [2,3], g: 0, a: 0, e: "Before: Close 1 or 2" },
        { n: "Dive", s: 5, p: 5, r: [3,4], g: 0, a: 0, e: "Before: Close 1" }, { n: "Dive", s: 5, p: 5, r: [3,4], g: 0, a: 0, e: "Before: Close 1" },
        { n: "Spike", s: 3, p: 5, r: [1,2], g: 5, a: 0, crit: true, e: "Crit: Inmune Stun" }, { n: "Spike", s: 3, p: 5, r: [1,2], g: 5, a: 0, crit: true, e: "Crit: Inmune Stun" },
        { n: "Sweep", s: 2, p: 6, r: [1,3], g: 0, a: 2, e: "Hit: Push 1" }, { n: "Sweep", s: 2, p: 6, r: [1,3], g: 0, a: 2, e: "Hit: Push 1" },
        { n: "Focus", s: 1, p: 4, r: [1,7], g: 5, a: 3, e: "After: Draw 1" }, { n: "Focus", s: 1, p: 4, r: [1,7], g: 5, a: 3, e: "After: Draw 1" },
        { n: "Psycho Crusher", s: 4, p: 4, r: [1,2], g: 0, a: 0, e: "Hit: Pass Through" }, { n: "Head Press", s: 5, p: 5, r: [1,3], g: 0, a: 0, crit: true, e: "Crit: +1 SPD/POW" },
        { n: "Knee Nightmare", s: 6, p: 6, r: [1,2], g: 2, a: 0, ultra: true, cost: 3, e: "Ultra: Bison S3" }
    ];

    let state = { hpP: 30, hpB: 30, r: 4, deck: [], hand: [], gauge: [], discard: [], adv: "NINGUNA", exc: false, res: false, curr: null, active: "", isCrit: false, stunnedB: false, stunnedP: false };

    function log(m) { const l = document.getElementById("log"); l.innerHTML += `> ${m}<br>`; l.scrollTop = l.scrollHeight; }
    
    function updateUI() {
        document.getElementById("pHPText").innerText = state.hpP;
        document.getElementById("bHPText").innerText = state.hpB;
        document.getElementById("pHPFill").style.width = (state.hpP/30*100) + "%";
        document.getElementById("bHPFill").style.width = (state.hpB/30*100) + "%";
        document.getElementById("deckCount").innerText = state.deck.length;
        document.getElementById("gaugeCount").innerText = state.gauge.length;
        document.getElementById("handCount").innerText = state.hand.length;
        if (state.hpP <= 0) finGame("K.O. - HAS PERDIDO");
        if (state.hpB <= 0) finGame("¡VICTORIA!");
    }

    function drawCard() {
        if (state.deck.length === 0) {
            if (state.res) { finGame("VICTORIA POR FATIGA"); return false; }
            state.hpB -= 1; state.deck = [...state.discard]; state.discard = [];
            state.deck.sort(() => Math.random() - 0.5); state.res = true;
            log("!! Mazo vacío. Bison rebaraja (-1 PV).");
        }
        if (state.deck.length > 0) state.hand.push(state.deck.pop());
        return true;
    }

    function turnoBison() {
        state.active = "BISON"; 
        if (state.gauge.length >= 3 && !state.exc) {
            state.exc = true; state.discard.push(...state.gauge.splice(0,3));
            log("¡BISON ACTIVA MODO EXCEED!"); return updateUI();
        }
        prepStrike();
    }

    function strikeManual() { state.active = "PLAYER"; log("--- ASALTO JUGADOR ---"); prepStrike(); }

    function prepStrike() {
        let valid = state.hand.filter(c => state.r >= c.r[0] && state.r <= c.r[1]);
        if (valid.length === 0) {
            log("Bison sin cartas en rango. ¡WILD SWING!");
            state.curr = state.deck.length > 0 ? state.deck.pop() : state.hand.pop();
        } else {
            state.curr = valid[Math.floor(Math.random() * valid.length)];
            state.hand.splice(state.hand.indexOf(state.curr), 1);
        }
        state.stunnedB = false; state.stunnedP = false; state.isCrit = false;
        document.getElementById("strikeUI").style.display = "block";
        document.getElementById("inputs").style.display = "block";
        document.getElementById("btnRevelar").style.display = "block";
        document.getElementById("resolveStep").style.display = "none";
        document.getElementById("stunCheck").style.display = "none";
        document.getElementById("afterPhase").style.display = "none";
        document.getElementById("bisonCard").style.display = "none";
    }

    function revelar() {
        if (state.curr.crit && state.gauge.length > 0) {
            state.isCrit = true; state.discard.push(state.gauge.pop());
            if (state.curr.n === "Head Press") { state.curr.s += 1; state.curr.p += 1; }
            log("Bison gasta 1 Gauge: ¡CRITICAL!");
        }
        document.getElementById("bisonCard").innerHTML = `<b>${state.curr.n}</b> ${state.isCrit ? '[CRIT]' : ''}<br>SPD: ${state.curr.s} | POW: ${state.curr.p} | GRD: ${state.curr.g} | ARM: ${state.curr.a}<br><small>${state.curr.e}</small>`;
        document.getElementById("bisonCard").style.display = "block";
        document.getElementById("btnRevelar").style.display = "none";
        document.getElementById("resolveStep").style.display = "block";
    }

    function compararVelocidad() {
        const pS = parseInt(document.getElementById("pSpeed").value);
        const bS = state.curr.s;
        let bGana = (state.adv === "BISON") || (state.adv === "NINGUNA" && state.active === "BISON");
        
        document.getElementById("resolveStep").style.display = "none";
        document.getElementById("inputs").style.display = "none";
        
        if (bS > pS || (bS === pS && bGana)) {
            log("Bison es más rápido.");
            document.getElementById("msgBisonHit").innerText = `Bison impacta (${state.curr.p} daño)`;
            document.getElementById("stunCheck").style.display = "block";
        } else {
            log("Eres más rápido.");
            state.stunnedB = impactar("BISON", parseInt(document.getElementById("pDmg").value), state.curr.g, state.curr.a);
            if (!state.stunnedB && state.hpB > 0) {
                state.stunnedP = impactar("PLAYER", state.curr.p, 0, 0);
            }
            faseAfter();
        }
    }

    function impactar(t, p, g, a) {
        let dmg = Math.max(0, p - a);
        if (t === "BISON") {
            state.hpB -= dmg; log(`Bison recibe ${dmg} daño.`);
            if (dmg > g) {
                if (state.curr.n === "Spike" && state.isCrit) { log("Inmunidad Spike: No hay stun."); return false; }
                log("¡BISON ATURDIDO!"); return true;
            }
        } else { state.hpP -= dmg; log(`Recibes ${dmg} daño.`); }
        updateUI(); return false;
    }

    function finalizarAsalto(st) {
        state.stunnedP = st;
        if (!state.stunnedP) impactar("BISON", parseInt(document.getElementById("pDmg").value), state.curr.g, state.curr.a);
        document.getElementById("stunCheck").style.display = "none";
        faseAfter();
    }

    function faseAfter() {
        log("--- FASE AFTER ---");
        document.getElementById("afterPhase").style.display = "block";
        let bisonMsg = state.stunnedB ? "Bison aturdido: Sin efectos After." : `Efectos Bison: <b>${state.curr.e}</b>`;
        document.getElementById("afterText").innerHTML = bisonMsg;
    }

    function limpiar() {
        state.gauge.push(state.curr);
        document.getElementById("strikeUI").style.display = "none";
        log("Limpieza: Carta al Gauge. SIN ROBO automático.");
        updateUI();
    }

    function toggleAdv() {
        const l = ["NINGUNA", "PLAYER", "BISON"];
        state.adv = l[(l.indexOf(state.adv) + 1) % 3];
        document.getElementById("btnAdv").innerText = "VENTAJA: " + state.adv;
    }

    function modDist(v) { state.r = Math.max(1, Math.min(7, state.r + v)); document.getElementById("rangeText").innerText = state.r; }
    function finGame(t) { document.getElementById("gameOver").style.display = "flex"; document.getElementById("winText").innerText = t; }

    db.forEach(c => { 
        if(c.ultra) state.deck.push({...c}); 
        else { state.deck.push({...c}); state.deck.push({...c}); }
    });
    state.deck.sort(() => Math.random() - 0.5);
    for(let i=0; i<5; i++) drawCard();
    updateUI();
</script>
</body>
</html>
